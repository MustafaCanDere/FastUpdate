name: Test ve Derleme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Birim testleri
        shell: powershell
        run: .\tests\Test-FastUpdate.ps1

      - name: Ekran görüntüleri
        shell: powershell
        run: .\tests\Render-Screenshots.ps1 -OutDir "$env:RUNNER_TEMP\shots"

      - name: Ekran görüntülerini yayınla
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -e
          BRANCH=screenshots
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then BRANCH=screenshots-preview; fi
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q -b "$BRANCH"
          cp "$RUNNER_TEMP"/shots/*.png .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png && git commit -qm "Ekran görüntüleri: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path .\FastUpdate.ps1 -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { exit 1 }

      - name: Gerçek tarama (rapor modu)
        shell: powershell
        timeout-minutes: 25
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'FastUpdate-Rapor.html'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\FastUpdate.ps1 -ReportOnly -ReportPath $out
          if ($LASTEXITCODE -ne 0) { throw "Çıkış kodu $LASTEXITCODE" }
          Get-Content "$env:APPDATA\FastUpdate\logs\*.log" | Write-Host
          if (-not (Test-Path $out)) { throw 'Rapor oluşturulmadı' }
          if ((Get-Content $out -Raw) -notmatch 'FastUpdate Raporu') { throw 'Rapor içeriği hatalı' }
          if (Select-String -Path "$env:APPDATA\FastUpdate\logs\*.log" -Pattern '^.{0,12}Hata:' -Quiet) { throw 'Taramada hata oluştu' }

      - name: Örnek rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ornek-rapor
          path: ${{ runner.temp }}/FastUpdate-Rapor.html
          if-no-files-found: ignore

      - name: .exe derle
        shell: powershell
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          $ver = (Select-String -Path .\FastUpdate.ps1 -Pattern "^\`$AppVersion = '(.+)'").Matches[0].Groups[1].Value
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-ps2exe -inputFile .\FastUpdate.ps1 -outputFile .\dist\FastUpdate.exe -noConsole -requireAdmin `
            -title 'FastUpdate' -product 'FastUpdate' -description 'Ücretsiz sürücü ve program güncelleyici' `
            -company 'MustafaCanDere' -copyright 'MIT' -version "$ver.0"
          Copy-Item FastUpdate.ps1, FastUpdate.bat, README.md, LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath FastUpdate.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FastUpdate
          path: dist/

      # main'e yeni bir $AppVersion ile gönderim yapılınca o sürüm otomatik yayınlanır
      - name: Sürüm zaten yayında mı?
        id: check
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v') || steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          name: FastUpdate ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/FastUpdate.exe
            FastUpdate.zip
          generate_release_notes: true
